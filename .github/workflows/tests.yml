name: T100 protocol tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Run protocol and UDP simulator tests
        run: python -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python -m compileall -q src ros2/t100_livox_compat
