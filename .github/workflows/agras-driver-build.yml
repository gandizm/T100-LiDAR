name: Agras T100 driver build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  standalone-cpp:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure standalone C++ driver
        run: |
          cmake -S integrations/mid360_agras_t100_lidar_driver/linux \
            -B build/agras-linux -DCMAKE_BUILD_TYPE=Release
      - name: Build standalone C++ driver
        run: cmake --build build/agras-linux --parallel 2

  python-tools-syntax:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check imported Python tools
        run: |
          python -m compileall -q \
            integrations/mid360_agras_t100_lidar_driver/tools \
            integrations/mid360_agras_t100_lidar_driver/scripts \
            integrations/mid360_agras_t100_lidar_driver/windows_viewer

  ros2-humble:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble
      - name: Install colcon and ROS dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-colcon-common-extensions
          source /opt/ros/humble/setup.bash
          rosdep update
          rosdep install --rosdistro humble \
            --from-paths integrations/mid360_agras_t100_lidar_driver/ros2_ws/src \
            --ignore-src -r -y
      - name: Build ROS 2 driver and FAST-LIO2 workspace
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          cd integrations/mid360_agras_t100_lidar_driver/ros2_ws
          colcon build --symlink-install --parallel-workers 1
