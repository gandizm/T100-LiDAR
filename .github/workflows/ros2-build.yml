name: ROS 2 driver build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ros2-humble:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble
      - name: Install ROS dependencies
        shell: bash
        run: |
          sudo apt-get update
          rosdep update
          rosdep install --from-paths ros2/livox_ros_driver2 --ignore-src -r -y
      - name: Build the native T100 Livox-compatible driver
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build \
            --base-paths ros2/livox_ros_driver2 \
            --build-base build/ros2 \
            --install-base install/ros2 \
            --log-base log/ros2
