name: ROS 2 compatibility build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ros2-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ros_distro: [humble, jazzy]
    container:
      image: ros:\${{ matrix.ros_distro }}-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: Install colcon and package dependencies
        run: |
          apt-get update
          apt-get install -y python3-colcon-common-extensions python3-pip
          apt-get install -y ros-\${ROS_DISTRO}-rclpy ros-\${ROS_DISTRO}-sensor-msgs
          apt-get install -y ros-\${ROS_DISTRO}-launch ros-\${ROS_DISTRO}-launch-ros
          apt-get install -y ros-\${ROS_DISTRO}-rosidl-default-generators
          apt-get install -y ros-\${ROS_DISTRO}-rosidl-default-runtime
      - name: Build T100 ROS 2 replacement packages
        shell: bash
        run: |
          source /opt/ros/\${ROS_DISTRO}/setup.bash
          colcon build --base-paths ros2/livox_ros_driver2 ros2/t100_livox_compat
          source install/setup.bash
          ros2 pkg prefix livox_ros_driver2
          ros2 pkg prefix t100_livox_compat
      - name: Run Python protocol and ROS conversion tests
        run: |
          python3 -m pip install -e .
          python3 -m unittest discover -s tests -v
